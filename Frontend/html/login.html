<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

<div class="container">

<h2>Login</h2>

<select id="role">
    <option value="farmer">Farmer</option>
    <option value="researcher">Researcher</option>
</select>

<input id="email" type="email" placeholder="Email">

<input id="org_code" placeholder="Org code (researcher)">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>


<script>

const roleSelect = document.getElementById("role");
const orgCode = document.getElementById("org_code");

// Show or hide org code
function updateLoginFields() {
    if (roleSelect.value === "researcher") {
        orgCode.style.display = "block";
    } else {
        orgCode.style.display = "none";
    }
}

updateLoginFields();
roleSelect.addEventListener("change", updateLoginFields);

// LOGIN function

async function login() {

const role = document.getElementById("role").value
const email = document.getElementById("email").value
const password = document.getElementById("password").value
const org = document.getElementById("org_code").value

let url = ""
let payload = {}

if(role === "farmer"){
    url = "http://127.0.0.1:8000/auth/farmers/login"
    payload = {email, password}
}

if(role === "researcher"){
    url = "http://127.0.0.1:8000/auth/researchers/login"
    payload = {email, org_code: org, password}
}

try {
    const res = await fetch(url,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
    })

    const data = await res.json()

    console.log(data)

    if(res.ok && data.access_token){
        alert("Login successful")
    } else {
        alert("Login failed")
    }

} catch(error){
    console.error(error)
    alert("Server error")
}

}

</script>

</body>
</html>
