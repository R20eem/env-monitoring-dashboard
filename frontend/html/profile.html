<div class="sh-main">
  <header class="sh-topbar">
    <div class="sh-topbar-title" data-i18n="nav.profile">Profile</div>
    <div class="sh-topbar-right">
      <a href="about.html" class="sh-about-link" data-i18n="nav.about">ℹ About Us</a>
    </div>
  </header>

  <main class="sh-content">

    <div class="sh-hero sh-mb-24">
      <h1 data-i18n="profile.h1">My Profile</h1>
      <p data-i18n="profile.hero_p">Manage your account details and preferences.</p>
    </div>

    <!-- PROFILE CARD -->
    <div class="prof-card">

      <div class="prof-header">
        <div class="prof-avatar" id="profile-avatar">?</div>
        <div class="prof-header-info">
          <div class="prof-name" id="profile-name">Loading...</div>
          <div class="prof-role-badge" id="profile-role-badge">—</div>
        </div>
      </div>

      <div class="prof-fields" id="profile-fields"></div>

      <button id="edit-btn" class="prof-edit-btn" data-i18n="profile.edit_btn">Edit Profile</button>

    </div>

    <!-- EDIT MODAL -->
    <div id="edit-modal" class="prof-modal-overlay">
      <div class="prof-modal-box">

        <div class="prof-modal-header">
          <h3 data-i18n="profile.edit_title">Edit Profile</h3>
          <button id="close-btn" class="prof-modal-close">✕</button>
        </div>

        <div class="prof-modal-body">
          <div class="prof-input-group">
            <label data-i18n="profile.first_name">First Name</label>
            <input id="edit-first" class="prof-input" placeholder="First name">
          </div>
          <div class="prof-input-group">
            <label data-i18n="profile.last_name">Last Name</label>
            <input id="edit-last" class="prof-input" placeholder="Last name">
          </div>
          <div class="prof-input-group" id="edit-end-group" style="display:none;">
            <label data-i18n="profile.end_date">Research End Date</label>
            <input id="edit-end" class="prof-input" type="date">
          </div>
        </div>

        <div class="prof-modal-footer">
          <button id="save-btn" class="prof-save-btn" data-i18n="profile.save_btn">Save changes</button>
          <button id="cancel-btn" class="prof-cancel-btn" data-i18n="profile.cancel_btn">Cancel</button>
        </div>

        <div id="edit-feedback" class="prof-feedback"></div>

      </div>
    </div>

  </main>
</div>

<script src="../js/l18n.js"></script>
