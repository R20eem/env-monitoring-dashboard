<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Eco Leaf</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body class="sh-page">

<aside class="sh-sidebar">
  <div class="sh-sidebar-logo">
    <img src="../images/logo_transparent.png" alt="Eco Leaf">
    <div class="sh-brand">Eco Leaf<small>Environmental Monitor</small></div>
  </div>

  <nav class="sh-nav">
    <div class="sh-nav-label" data-i18n="nav.navigation">Navigation</div>
    <a href="#" class="sh-nav-link sh-dash-link">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>
      <span data-i18n="nav.dashboard">Dashboard</span>
    </a>
    <a href="blog.html" class="sh-nav-link">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h14M3 9h10M3 13h12M3 17h8"/></svg>
      <span data-i18n="nav.blog">Community Blog</span>
    </a>
    <a href="profile.html" class="sh-nav-link active">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="7" r="3"/><path d="M3 17c0-3.3 3.1-6 7-6s7 2.7 7 6"/></svg>
      <span data-i18n="nav.profile">Profile</span>
    </a>
  </nav>

  <div class="sh-sidebar-bottom">
    <div class="sh-user-row sh-hidden" id="sh-user-row">
      <div class="sh-avatar" id="sh-avatar">?</div>
      <div class="sh-user-info">
        <div class="sh-user-name" id="sh-user-name">User</div>
        <div class="sh-user-role" id="sh-user-role">guest</div>
      </div>
    </div>
    <a href="login.html" class="sh-nav-link" id="sh-login-link">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10h11M10 5l5 5-5 5"/></svg>
      <span data-i18n="nav.signin">Sign In</span>
    </a>
    <a href="#" class="sh-nav-link" id="sh-logout-btn" style="color:rgba(255,120,120,0.8);">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 15l4-5-4-5M17 10H7M7 3H4a1 1 0 00-1 1v12a1 1 0 001 1h3"/></svg>
      <span data-i18n="nav.logout">Logout</span>
    </a>
  </div>
</aside>

<div class="sh-main">
  <header class="sh-topbar">
    <div class="sh-topbar-title" data-i18n="profile.title">Profile</div>
    <div class="sh-topbar-right">
      <a href="about.html" class="sh-about-link" data-i18n="nav.about">ℹ About Us</a>
      <div id="sh-nav-actions"></div>
    </div>
  </header>

  <main class="sh-content">

    <div class="sh-hero sh-mb-24">
      <h1 data-i18n="profile.h1">My Profile</h1>
      <p data-i18n="profile.hero_p">Manage your account details and preferences.</p>
    </div>

    <div class="sh-card" style="max-width:600px;">
      <div style="display:flex;align-items:center;gap:20px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--sh-border);">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--sh-green-100);display:flex;align-items:center;justify-content:center;font-family:'Trebuchet MS',sans-serif;font-size:22px;font-weight:700;color:var(--sh-green-700);overflow:hidden;" id="profile-avatar">?</div>
        <div>
          <div style="font-family:'Trebuchet MS',sans-serif;font-size:18px;font-weight:700;color:var(--sh-text-1);cursor:pointer;" id="profile-name" title="Click to edit">Loading...</div>
          <div style="font-size:13px;color:var(--sh-text-3);margin-top:3px;text-transform:capitalize;" id="profile-role">—</div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--sh-border);">
          <span style="font-size:13px;color:var(--sh-text-3);" data-i18n="profile.email">Email</span>
          <span style="font-size:13px;font-weight:600;color:var(--sh-text-1);" id="profile-email">—</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--sh-border);">
          <span style="font-size:13px;color:var(--sh-text-3);" data-i18n="profile.role">Role</span>
          <span style="font-size:13px;font-weight:600;color:var(--sh-text-1);text-transform:capitalize;" id="profile-role-2">—</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--sh-border);">
          <span style="font-size:13px;color:var(--sh-text-3);" data-i18n="profile.org">Organization Code</span>
          <span style="font-size:13px;font-weight:600;color:var(--sh-text-1);" id="profile-org">—</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--sh-border);">
          <span style="font-size:13px;color:var(--sh-text-3);" data-i18n="profile.end">Research End Date</span>
          <span style="font-size:13px;font-weight:600;color:var(--sh-text-1);" id="profile-end">—</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;">
          <span style="font-size:13px;color:var(--sh-text-3);" data-i18n="profile.member">Member since</span>
          <span style="font-size:13px;font-weight:600;color:var(--sh-text-1);">2026</span>
        </div>
      </div>

      <button id="edit-btn" class="edit-profile-btn" data-i18n="profile.edit_btn">Edit Profile</button>

    <div id="edit-modal" class="modal-overlay">
      <div class="modal-box">
        <h3 data-i18n="profile.modal_h">Edit Profile</h3>
        <input id="edit-first" class="edit-input" data-i18n-ph="profile.first_ph" placeholder="First Name">
        <input id="edit-last"  class="edit-input" data-i18n-ph="profile.last_ph"  placeholder="Last Name">
        <input id="edit-org"   class="edit-input" data-i18n-ph="profile.org_ph"   placeholder="Organization Code">
        <input id="edit-end"   class="edit-input" type="date">
        <button id="save-btn"  class="sh-btn sh-btn-outline" data-i18n="profile.save_btn">Save</button>
        <button id="close-btn" class="sh-btn sh-btn-outline" data-i18n="profile.cancel_btn">Cancel</button>
      </div>
    </div>
  </main>
</div>

<script src="../js/l18n.js"></script>
<script src="../js/profile.js"></script>
<script src="../js/shared-nav.js"></script>
</body>
</html>
