  <!--
    File: profile.html

    Purpose:
    User profile page for viewing and managing account information.

    Responsibilities:
    - Display user profile details and account role
    - Provide editable profile fields through a modal form
    - Support profile updates and feedback messaging
    - Integrate shared sidebar and mobile navigation components
    - Provide responsive layout for desktop and mobile devices

    Layer:
    Frontend (HTML)

    Related:
    - profile.css
    - profile.js
    - shared.css
    - shared-nav.js
    - style.css
-->

  <link rel="stylesheet" href="../css/shared.css">

  <style>
    body.sh-page { overflow-x:hidden; }

      .sh-sidebar { display: none !important; }
      .f-main { margin-left: 0 !important; width: 100% !important; }
      .sh-main { margin-left: 0 !important; width: 100% !important; }
      .f-layout { flex-direction: column !important; }
    }
  </style>

    <a href="alerts.html" class="sh-nav-link" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,0.6);text-decoration:none;font-size:13.5px;font-weight:500;position:relative;z-index:2;">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px;flex-shrink:0;"><path d="M10 3v8M10 15h.01M4 17h12l-6-14-6 14z"/></svg>
      <span data-i18n="nav.alerts">Alerts</span>

    <a href="scanner.html" class="sh-nav-link" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,0.6);text-decoration:none;font-size:13.5px;font-weight:500;position:relative;z-index:2;">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px;flex-shrink:0;"><path d="M4 4h4v2H6v2H4V4zm12 0v4h-2V6h-2V4h4zM4 16v-4h2v2h2v2H4zm12-4v4h-4v-2h2v-2h2z"/></svg>

    <a href="blog.html" class="sh-nav-link" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,0.6);text-decoration:none;font-size:13.5px;font-weight:500;position:relative;z-index:2;">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px;flex-shrink:0;"><path d="M3 5h14M3 9h10M3 13h12M3 17h8"/></svg>
      <span data-i18n="nav.blog">Community Blog</span>
    </a>
    <a href="profile.html" class="sh-nav-link active" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#ffffff;text-decoration:none;font-size:13.5px;font-weight:500;background:rgba(255,255,255,0.12);position:relative;z-index:2;">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px;flex-shrink:0;"><circle cx="10" cy="7" r="3"/><path d="M3 17c0-3.3 3.1-6 7-6s7 2.7 7 6"/></svg>
      <span data-i18n="nav.profile">Profile</span>
    </a>

      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="width:16px;height:16px;flex-shrink:0;"><circle cx="10" cy="10" r="8"/><path d="M10 6v4M10 14v2"/></svg>
      <span data-i18n="nav.about">About Us</span>
    </a> -->
  </nav>

  <div class="sh-sidebar-bottom" style="padding:16px 14px 20px;border-top:1px solid rgba(255,255,255,0.06);position:relative;z-index:2;">
    <div class="sh-user-row sh-hidden" id="sh-user-row">
      <div class="sh-avatar" id="sh-avatar">?</div>
      <div class="sh-user-info">
        <div class="sh-user-name" id="sh-user-name">User</div>
        <div class="sh-user-role" id="sh-user-role">guest</div>
      </div>
    </div>
    <a href="login.html" class="sh-nav-link" id="sh-login-link">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10h11M10 5l5 5-5 5"/></svg>
      <span data-i18n="nav.signin">Sign In</span>
    </a>
    <a href="#" class="sh-nav-link" id="sh-logout-btn" style="color:rgba(255,120,120,0.8);">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 15l4-5-4-5M17 10H7M7 3H4a1 1 0 00-1 1v12a1 1 0 001 1h3"/></svg>
      <span data-i18n="nav.logout">Logout</span>
    </a>

</aside>

<div class="sh-main">
  <header class="sh-topbar">
    <div class="sh-topbar-title" data-i18n="nav.profile">Profile</div>
    <div class="sh-topbar-right">
      <a href="about.html" class="sh-about-link" data-i18n="nav.about">ℹ About Us</a>
    </div>
  </header>

  <main class="sh-content">

    <div class="sh-hero sh-mb-24">
      <h1 data-i18n="profile.h1">My Profile</h1>
      <p data-i18n="profile.hero_p">Manage your account details and preferences.</p>
    </div>

    <!-- PROFILE CARD -->
    <div class="prof-card">

      <div class="prof-header">
        <div class="prof-avatar" id="profile-avatar">?</div>
        <div class="prof-header-info">
          <div class="prof-name" id="profile-name">Loading...</div>
          <div class="prof-role-badge" id="profile-role-badge">—</div>
        </div>
      </div>

      <div class="prof-fields" id="profile-fields"></div>

      <div class="prof-card-actions">
        <button type="button" id="edit-btn" class="prof-edit-btn">Edit Profile</button>
        <button type="button" id="change-pass-btn" class="prof-change-pass-btn">Change password</button>
      </div>


    </div>

    <!-- EDIT MODAL -->
    <div id="edit-modal" class="prof-modal-overlay">
      <div class="prof-modal-box">

        <div class="prof-modal-header">
          <h3 data-i18n="profile.edit_title">Edit Profile</h3>
          <button id="close-btn" class="prof-modal-close">✕</button>
        </div>

        <div class="prof-modal-body">
          <div class="prof-input-group">
            <label for="edit-first" data-i18n="profile.first_name">First Name</label>
            <input id="edit-first" class="prof-input" placeholder="First name" aria-label="First name">
          </div>
          <div class="prof-input-group">
            <label for="edit-last" data-i18n="profile.last_name">Last Name</label>
            <input id="edit-last" class="prof-input" placeholder="Last name" aria-label="Last name">
          </div>
          <div class="prof-input-group" id="edit-end-group" style="display:none;">
            <label for="edit-end" data-i18n="profile.end_date">Research End Date</label>
            <input id="edit-end" class="prof-input" type="date" aria-label="Research end date">
          </div>
        </div>

        <div class="prof-modal-footer">
          <button id="save-btn" class="prof-save-btn" data-i18n="profile.save_btn">Save changes</button>
          <button id="cancel-btn" class="prof-cancel-btn" data-i18n="profile.cancel_btn">Cancel</button>
        </div>

        <div id="edit-feedback" class="prof-feedback"></div>

      </div>
    </div>
     <!-- Change Password -->
    <div id="pass-modal" class="prof-modal-overlay">
      <div class="prof-modal-box">

        <div class="prof-modal-header">
          <h3>Change password</h3>
          <button type="button" id="pass-close-btn" class="prof-modal-close">✕</button>
        </div>

        <div class="prof-modal-body">
          <div class="prof-input-group">
            <label for="pass-current">Current password</label>
            <div class="password-field">
              <input id="pass-current" type="password" class="prof-input password-field-input" autocomplete="current-password" placeholder="Current password">
              <button type="button" class="password-toggle" aria-pressed="false" aria-label="Show password" aria-controls="pass-current" data-label-show="Show current password" data-label-hide="Hide current password">
                <span class="password-toggle__show" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                <span class="password-toggle__hide" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></span>
              </button>
            </div>
          </div>
          <div class="prof-input-group">
            <label for="pass-new">New password</label>
            <div class="password-field">
              <input id="pass-new" type="password" class="prof-input password-field-input" autocomplete="new-password" placeholder="At least 8 characters">
              <button type="button" class="password-toggle" aria-pressed="false" aria-label="Show new password" aria-controls="pass-new" data-label-show="Show new password" data-label-hide="Hide new password">
                <span class="password-toggle__show" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                <span class="password-toggle__hide" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></span>
              </button>
            </div>
          </div>
          <div class="prof-input-group">
            <label for="pass-confirm">Confirm new password</label>
            <div class="password-field">
              <input id="pass-confirm" type="password" class="prof-input password-field-input" autocomplete="new-password" placeholder="Repeat new password">
              <button type="button" class="password-toggle" aria-pressed="false" aria-label="Show confirm password" aria-controls="pass-confirm" data-label-show="Show confirm password" data-label-hide="Hide confirm password">
                <span class="password-toggle__show" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                <span class="password-toggle__hide" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></span>
              </button>
            </div>
          </div>
        </div>

        <div class="prof-modal-footer">
          <button type="button" id="pass-save-btn" class="prof-save-btn">Update password</button>
          <button type="button" id="pass-cancel-btn" class="prof-cancel-btn">Cancel</button>
        </div>

        <div id="pass-feedback" class="prof-feedback"></div>

      </div>
    </div>


  </main>
</div>

<script src="../js/l18n.js"></script>
<script src="../js/password-toggle.js"></script>
<script src="../js/profile.js"></script>
<script src="../js/shared-nav.js"></script>
<!-- Mobile Bottom Navigation — role-aware -->
<nav class="sh-mobile-nav" id="sh-mobile-nav"></nav>
<script>
  (function() {
    var isResearcher = localStorage.getItem('userRole') === 'researcher';
    var dashHref = isResearcher ? 'researcher.html' : 'index.html';
    var links = isResearcher ? [
      { href: dashHref, label: 'Dashboard', icon: '<rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/>' },
      { href: 'blog.html', label: 'Blog', icon: '<path d="M3 5h14M3 9h10M3 13h12M3 17h8"/>' },
      { href: 'profile.html', label: 'Profile', active: true, icon: '<circle cx="10" cy="7" r="3"/><path d="M3 17c0-3.3 3.1-6 7-6s7 2.7 7 6"/>' }
    ] : [
      { href: 'index.html', label: 'Dashboard', icon: '<rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/>' },
      { href: 'alerts.html', label: 'Alerts', icon: '<path d="M10 3v8M10 15h.01M4 17h12l-6-14-6 14z"/>' },
      { href: 'scanner.html', label: 'Scanner', icon: '<path d="M4 4h4v2H6v2H4V4zm12 0v4h-2V6h-2V4h4zM4 16v-4h2v2h2v2H4zm12-4v4h-4v-2h2v-2h2z"/>' },
      { href: 'blog.html', label: 'Blog', icon: '<path d="M3 5h14M3 9h10M3 13h12M3 17h8"/>' },
      { href: 'profile.html', label: 'Profile', active: true, icon: '<circle cx="10" cy="7" r="3"/><path d="M3 17c0-3.3 3.1-6 7-6s7 2.7 7 6"/>' }
    ];
    var nav = document.getElementById('sh-mobile-nav');
    nav.innerHTML = links.map(function(l) {
      return '<a href="' + l.href + '"' + (l.active ? ' class="active"' : '') + '>'
        + '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">' + l.icon + '</svg>'
        + '<span>' + l.label + '</span></a>';
    }).join('');
  })();
</script>

<script>
  (function() {
    if (window.innerWidth <= 860) document.body.classList.add('has-mobile-nav');
    window.addEventListener('resize', function() {
      document.body.classList.toggle('has-mobile-nav', window.innerWidth <= 860);
    });
  })();
</script>
</body>
</html>
