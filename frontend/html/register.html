<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Leaf - Register</title>
    <!--
    File: register.html

    Purpose:
    Main HTML template for user registration.
    Allows new users (farmers and researchers) to create an account.

    Responsibilities:
    - Provide registration form with role selection (farmer / researcher)
    - Collect user details (name, email, password, experience, location)
    - Capture role-specific data (organization code, connection end date)
    - Submit registration data to backend via auth.js
    - Redirect users to login page after successful registration

    Layer:
    Frontend (HTML Template)

    Related:
    - auth.js (handles registration logic and API communication)
    - style.css (global styling and layout)
    - login.html (redirect after successful registration)
-->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f7f6;">

    <div class="stat-card" style="width: 400px; padding: 40px; margin: 20px;">
        
        <div style="text-align: center; margin-bottom: 25px;">
            <img src="../images/logo_transparent.png" alt="Eco Leaf Logo" style="height: 60px;">
            <h2 style="color: #117a3d; margin-top: 15px;">Create an Account</h2>
        </div>

        <div style="display: flex; flex-direction: column; gap: 15px;">
            
            <select id="role" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px;">
                <option value="farmer">🌾 I am a Farmer</option>
                <option value="researcher">🔬 I am a Researcher</option>
            </select>

            <div style="display: flex; gap: 10px;">
                <input id="first_name" placeholder="First Name" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
                <input id="last_name" placeholder="Last Name" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
            </div>
            
            <input id="email" placeholder="Email Address" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
            
            <select id="experience" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
                <option value="">Years of Experience</option>
                <option value="0-1 years">0-1 years</option>
                <option value="1-3 years">1-3 years</option>
                <option value="3-5 years">3-5 years</option>
                <option value="5+ years">5+ years</option>
            </select>
            
            <input id="location" placeholder="Farm Location" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
            
            <input id="org_code" placeholder="Organization Code (e.g. 1234)" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
            
            <input id="connection_end" type="date" title="Access Expiry Date — when your organisation access ends" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; color: #666;">
            <p id="connection_end_hint" style="font-size:11px; color:#888; margin-top:-8px; margin-bottom:0;">Access expiry date — must be a future date</p>

            <div class="password-field">
                <input id="password" class="password-field-input" type="password" placeholder="Create Password" autocomplete="new-password" style="padding: 12px 44px 12px 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px;">
                <button type="button" class="password-toggle" aria-pressed="false" aria-label="Show password" aria-controls="password">
                    <span class="password-toggle__show" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                    <span class="password-toggle__hide" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></span>
                </button>
            </div>
            <button onclick="register()" class="btn-primary" style="padding: 14px; font-size: 16px; margin-top: 10px; width: 100%;">Register</button>
        </div>

        <p style="text-align: center; margin-top: 20px; font-size: 14px; color: #666;">
            Already have an account? <a href="login.html" style="color: #117a3d; font-weight: bold; text-decoration: none;">Log in</a>
        </p>
    </div>
    
    <script src="../js/password-toggle.js"></script>
    <script defer src="../js/auth.js"></script>

</body>
</html>
